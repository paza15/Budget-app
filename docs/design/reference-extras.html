<style>
/* ── Mock-only font plumbing ─────────────────────────────────────────────── */
:root {
  --font-ui: -apple-system, "Inter Mock", "Inter Variable", "Segoe UI", sans-serif;
  --ff-60: "PB Serif 60", var(--font-figures);
  --ff-34: "PB Serif 34", var(--font-figures);
  --ff-17: "PB Serif 17", var(--font-figures);
  --ff-17p: "PB Serif 17 P", var(--font-figures);
  --tabbar-offset: max(8px, calc(34px - 13px)); /* the app: env(safe-area-inset-bottom) is 34px on iPhone 15 */
}
html { font: -apple-system-body; font-size: 17px; } /* the app: html { font: -apple-system-body } */

/* ── Base ────────────────────────────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); overscroll-behavior: none; }
body { font: var(--text-body); color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; touch-action: manipulation; -webkit-touch-callout: none; }
svg { display: block; flex: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ── Device: iPhone 15 with status-bar style "default" ───────────────────────
   iOS draws the status bar itself, opaque, tinted with theme-color (= --bg). The web view starts
   under it, so content never scrolls beneath 9:41. */
.device { position: relative; width: 100%; height: 100dvh; overflow: hidden; background: var(--bg); }
.statusbar { position: absolute; inset: 0 0 auto; height: 59px; z-index: 200; background: var(--bg); color: var(--ink); pointer-events: none; }
.statusbar .time { position: absolute; left: 0; width: 133px; top: 17px; text-align: center; padding-left: 6px; font: 600 17px/22px var(--font-ui); }
.statusbar .glyphs { position: absolute; right: 0; width: 133px; top: 21px; display: flex; gap: 6px; justify-content: center; align-items: center; padding-right: 4px; }
.island { position: absolute; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; border-radius: 19px; background: #000; z-index: 201; }
.homeind { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); z-index: 210; }
.web { position: absolute; inset: 59px 0 0; overflow: hidden; }
.scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: var(--content-bottom); scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* iPhone SE: 20px status bar, no island, no home indicator; compact keypad (SPEC §3.4 fit) */
.se .statusbar { height: 20px; }
.se .statusbar .time { top: 0; font-size: 15px; line-height: 20px; }
.se .statusbar .glyphs { top: 4px; }
.se .island, .se .homeind { display: none; }
.se .web { top: 20px; }
.se { --tabbar-offset: 8px; }
.se .key { height: 48px; }
.se .amount { padding-top: 4px; }
.se .sheet .chips { margin-top: 14px; }
.se .sgroup .frow { min-height: 44px; gap: 8px; }
.se .frow .label { width: 42px; }
.se .mini { padding: 0 10px; }
.se .mini-row { gap: 5px; }
.se .sheet .btn.primary { height: 50px; margin-top: 10px; }
.se .sheet .bottom { height: 10px; }

/* ── Glass controls (iOS 26) ─────────────────────────────────────────────── */
/* Glass buttons sit on opaque paper (header, compact header, sheet), so they need no backdrop-filter:
   the tab bar is the only blurred layer. */
.glass { background: var(--glass); box-shadow: inset 0 0 0 0.5px var(--glass-edge), inset 0 1px 0 var(--glass-highlight), var(--shadow-control); }
.gbtn { width: var(--touch-min); height: var(--touch-min); border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
.gbtn svg { width: 21px; height: 21px; }
.gcap { height: var(--touch-min); border-radius: var(--radius-pill); display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; font: var(--text-body); color: var(--ink); white-space: nowrap; }
.gcap.tint { color: var(--accent-ink); font-weight: 600; }
.gcap svg { width: 17px; height: 17px; }

/* ── Header ──────────────────────────────────────────────────────────────── */
.nav { position: relative; height: var(--nav-height); display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 var(--gutter); gap: 8px; }
.nav .lead { display: flex; align-items: center; gap: 10px; min-width: 0; }
.nav .trail { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.eyebrow { font: var(--text-subhead); font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.stepper { display: flex; height: var(--touch-min); border-radius: var(--radius-pill); }
.stepper button { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); }
.stepper button svg { width: 17px; height: 17px; }
.stepper button[disabled] { color: var(--ink-disabled); }
.titlerow { height: var(--title-height); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px 0 var(--gutter); }
.month { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: var(--ink); }
.month .name { font: var(--text-month); font-family: var(--ff-34); letter-spacing: -0.005em; white-space: nowrap; }
.month svg { width: 16px; height: 16px; color: var(--ink-3); margin-top: 6px; }
.month .range { display: block; font: var(--text-subhead); color: var(--ink-2); }
.back-pill { height: 34px; padding: 0 14px; border-radius: var(--radius-pill); display: inline-flex; align-items: center; gap: 6px; font: var(--text-subhead); font-weight: 600; color: var(--accent-ink); position: relative; }
.back-pill::after { content: ""; position: absolute; inset: -5px 0; }
.back-pill svg { width: 15px; height: 15px; }
.largetitle { font: var(--text-large-title); padding: 0 var(--gutter); height: var(--title-height); display: flex; align-items: center; }

/* Compact header: appears when the large title has scrolled away. Opaque --bg (it continues the
   iOS status bar, which is theme-color) with a soft scroll-edge fade, no hairline. */
.compact { position: absolute; inset: 0 0 auto; height: var(--nav-height); z-index: var(--z-header); background: var(--bg); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 16px; }
.compact::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 18px; background: linear-gradient(var(--bg), color-mix(in srgb, var(--bg) 0%, transparent)); pointer-events: none; }
.compact .mid { text-align: center; line-height: 1; }
.compact .t { font: var(--text-month-compact); font-family: var(--ff-17p); display: block; }
.compact .s { font: var(--text-footnote); color: var(--ink-2); display: block; margin-top: 1px; }
.compact .trail { justify-self: end; display: flex; gap: 8px; }

/* ── Monogram medallion and coin badges ──────────────────────────────────── */
.medal { position: relative; width: 32px; height: 32px; display: grid; place-items: center; flex: none; color: var(--ink); }
.medal svg.rim { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: var(--ink); stroke-width: 0.55; opacity: 0.55; }
.medal b { font: 600 15px/1 var(--font-ui); }
.medal.lg { width: 64px; height: 64px; }
.medal.lg b { font-size: 26px; }
.medal.lg svg.rim { stroke-width: 0.4; }
.coin { position: relative; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--ink); box-shadow: inset 0 0 0 0.75px var(--hairline-strong); }
.coin svg { width: 19px; height: 19px; }
.coin.sm { width: 26px; height: 26px; }
.coin.sm svg { width: 15px; height: 15px; }
.coin.lg { width: 56px; height: 56px; box-shadow: inset 0 0 0 1px var(--hairline-strong); }
.coin.lg::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; box-shadow: inset 0 0 0 0.75px var(--hairline); }
.coin.lg svg { width: 28px; height: 28px; }

/* ── Hero ────────────────────────────────────────────────────────────────── */
.hero { padding: 10px var(--gutter) 0; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 22px; }
.hero-label { font: var(--text-subhead); font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.status { display: inline-flex; align-items: center; gap: 5px; font: var(--text-subhead); color: var(--ink-2); white-space: nowrap; }
.status svg { width: 16px; height: 16px; }
.status.warn { color: var(--warning-ink); font-weight: 500; }
.status.warn svg { color: var(--warning); }
.status.crit { color: var(--critical-ink); font-weight: 600; }
.status.crit svg { color: var(--critical); }
.hero-label.crit { color: var(--critical-ink); font-weight: 600; }
.hero-label.crit svg { width: 16px; height: 16px; color: var(--critical); }
.seal-chip { display: inline-flex; align-items: center; gap: 7px; font: var(--text-subhead); font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.seal-chip svg { width: 22px; height: 22px; fill: none; stroke: var(--brass); stroke-width: 0.8; }
.fig-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.seal-big { display: grid; justify-items: center; gap: 5px; margin-top: 6px; font: var(--text-footnote); color: var(--ink-2); white-space: nowrap; }
.seal-big svg { width: 54px; height: 54px; fill: none; stroke: var(--brass); stroke-width: 0.32; }
.figure { display: flex; align-items: baseline; margin: 6px 0 0 -3px; color: var(--ink); white-space: nowrap; }
.figure .v { font: var(--text-hero); font-family: var(--ff-60); letter-spacing: -0.012em; font-variant-numeric: proportional-nums; }
.figure .u { font: var(--text-hero-unit); font-family: var(--ff-60); color: var(--ink-2); margin-left: 0.16em; }
.figure.crit .v, .figure.crit .u { color: var(--critical-ink); }
.figure.muted .v { color: var(--ink); }
.sentence { font: var(--text-body); margin-top: 10px; }
.subline { font: var(--text-subhead); color: var(--ink-2); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.subline.warn { color: var(--warning-ink); font-weight: 500; }
.subline.warn svg { width: 16px; height: 16px; color: var(--warning); }
.hero .btn { margin-top: 14px; }

/* Pace bar: the month as a ruler */
.pace { margin-top: 20px; }
.pace svg { width: 100%; height: 26px; overflow: visible; }
.pace-cap { display: flex; justify-content: space-between; margin-top: 6px; font: var(--text-footnote); color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ── Sections and groups ─────────────────────────────────────────────────── */
.sect { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 var(--gutter); margin: var(--section-gap) 0 10px; }
.sect h2 { font: var(--text-title3); }
.sect .meta { font: var(--text-figure-sm); font-family: var(--ff-17p); color: var(--ink-2); white-space: nowrap; }
.sect .link { font: var(--text-subhead); font-weight: 600; color: var(--accent-ink); position: relative; }
.sect .link::after { content: ""; position: absolute; inset: -12px -10px; }
.group { margin: 0 var(--gutter); background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; }
.group.pad { padding: 4px var(--group-padding); }
.foot { font: var(--text-footnote); color: var(--ink-2); padding: 8px calc(var(--gutter) + var(--group-padding)) 0; }
.gtitle { font: var(--text-footnote); font-weight: 600; color: var(--ink-2); padding: 0 calc(var(--gutter) + var(--group-padding)); margin: 26px 0 7px; }

/* ── Ledger: the month written as a sum ──────────────────────────────────── */
.ledger { padding: 6px var(--group-padding) 14px; }
.lrow { display: grid; grid-template-columns: 22px 1fr auto 20px; align-items: center; min-height: 44px; position: relative; }
.lrow + .lrow::before { content: ""; position: absolute; top: 0; left: 22px; right: 0; height: var(--hairline-width); background: var(--hairline); }
.lrow .op { font: var(--text-figure); font-family: var(--ff-17); color: var(--ink-3); }
.lrow .lab { font: var(--text-body); }
.lrow .fig { font: var(--text-figure); font-family: var(--ff-17); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; position: relative; }
.lrow .unit { font: var(--text-figure); font-family: var(--ff-17); color: var(--ink); text-align: right; }
.lrow.result::before { display: none; }
.lrow.result { min-height: 52px; margin-top: 0; }
.lrow.result .lab { font-weight: 600; }
.lrow.result .op { color: var(--ink); }
.lrow.result .fig, .lrow.result .unit { font: var(--text-figure-strong); font-family: var(--ff-17); }
/* the sum rule closes the addends; the double rule closes the result; both span the figure column only */
.lrow.result .fig::before { content: ""; position: absolute; right: 0; top: -15px; width: var(--colw); height: var(--rule-width); background: var(--ink-3); }
.lrow.result .fig::after { content: ""; position: absolute; right: 0; bottom: -9px; width: var(--colw); height: calc(2 * var(--rule-width) + var(--double-rule-gap)); border-top: var(--rule-width) solid var(--brass); border-bottom: var(--rule-width) solid var(--brass); }
.lrow.result.crit .fig, .lrow.result.crit .unit { color: var(--critical-ink); }
.lrow.result.crit .fig::after { border-color: var(--critical); }

/* ── Where it went ───────────────────────────────────────────────────────── */
.breakdown { padding: 16px var(--group-padding) 6px; }
.stack { display: flex; gap: 2px; height: 10px; }
.stack i { display: block; height: 100%; }
.stack i:first-child { border-radius: var(--radius-data) 0 0 var(--radius-data); }
.stack i:last-child { border-radius: 0 var(--radius-data) var(--radius-data) 0; }
.legend { list-style: none; margin-top: 8px; }
.legend li { display: grid; grid-template-columns: 18px 1fr auto 46px; align-items: center; min-height: 40px; }
.legend .dot { width: 9px; height: 9px; border-radius: 50%; }
.legend .n { font: var(--text-body); }
.legend .v { font: var(--text-figure); font-family: var(--ff-17); text-align: right; }
.legend .p { font: var(--text-footnote); color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.plusline { display: flex; align-items: center; gap: 4px; min-height: 44px; border-top: var(--hairline-width) solid var(--hairline); margin-top: 4px; font: var(--text-subhead); color: var(--ink-2); }
.plusline svg { width: 14px; height: 14px; margin-left: auto; color: var(--ink-3); }

/* ── Limits (meters) ─────────────────────────────────────────────────────── */
.limit { display: grid; grid-template-columns: 34px 1fr; column-gap: 12px; padding: 12px var(--group-padding) 12px; position: relative; }
.limit + .limit::before { content: ""; position: absolute; top: 0; left: 62px; right: 0; height: var(--hairline-width); background: var(--hairline); }
.limit .coin { align-self: start; }
.limit .l1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; min-height: 22px; }
.limit .t { font: var(--text-body); }
.limit .a { font: var(--text-figure); font-family: var(--ff-17); white-space: nowrap; }
.meter { position: relative; height: 4px; border-radius: 2px; background: var(--track); margin-top: 9px; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--ink); }
.meter .now { position: absolute; top: -4px; width: 1px; height: 12px; background: var(--ink-2); }
.limit.warn .meter i { background: var(--warning-mark); }
.limit.over .meter i { background: var(--critical); }
.limit .l3 { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; font: var(--text-footnote); color: var(--ink-2); }
.limit .l3 .st { display: inline-flex; align-items: center; gap: 5px; }
.limit .l3 svg { width: 14px; height: 14px; }
.limit.warn .l3 .st { color: var(--warning-ink); font-weight: 500; }
.limit.warn .l3 .st svg { color: var(--warning); }
.limit.over .l3 .st { color: var(--critical-ink); font-weight: 600; }
.limit.over .l3 .st svg { color: var(--critical); }

/* ── List rows ───────────────────────────────────────────────────────────── */
.row { position: relative; display: grid; grid-template-columns: 34px 1fr; column-gap: 12px; align-items: start; min-height: var(--row-2); padding: 11px var(--group-padding) 11px; }
.row.one { align-items: center; min-height: var(--row-min); }
.row + .row::before { content: ""; position: absolute; top: 0; left: 62px; right: 0; height: var(--hairline-width); background: var(--hairline); }
.row.nob { grid-template-columns: 1fr; }
.row.nob + .row::before, .row + .row.nob::before { left: var(--group-padding); }
.row .coin { margin-top: 2px; }
.row .main { min-width: 0; }
.row .l1 { display: flex; align-items: baseline; gap: 10px; }
.row .t { font: var(--text-body); flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row .a { font: var(--text-figure); font-family: var(--ff-17); white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .a.paid { color: var(--ink-2); }
.row .a.skip { color: var(--ink-2); text-decoration: line-through; }
.row .l2 { display: flex; justify-content: space-between; gap: 10px; margin-top: 2px; font: var(--text-subhead); color: var(--ink-2); }
.row .l2 .when { white-space: nowrap; }
.chev { width: 14px; height: 14px; color: var(--ink-3); flex: none; }
.row .chev { align-self: center; }
.row.tick { grid-template-columns: 34px 1fr 28px; }
.row.nob.tick { grid-template-columns: 1fr 28px; }
.tick-btn { position: relative; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; justify-self: end; margin-top: -1px; box-shadow: inset 0 0 0 1.5px var(--mark); color: var(--ink-2); }
.tick-btn::after { content: ""; position: absolute; inset: -9px; }
.tick-btn.on { box-shadow: inset 0 0 0 1.25px var(--ink-2); }
.tick-btn svg { width: 14px; height: 14px; }
.divider { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 var(--group-padding); font: var(--text-footnote); font-weight: 600; color: var(--ink); }
.divider::after { content: ""; flex: 1; height: 1px; background: var(--ink); }
.ghead { display: flex; align-items: center; gap: 10px; padding: 0 var(--gutter); margin: 22px 0 8px; }
.ghead .coin { width: 26px; height: 26px; }
.ghead .coin svg { width: 15px; height: 15px; }
.ghead .n { font: var(--text-subhead); font-weight: 600; color: var(--ink); flex: 1; }
.ghead .v { font: var(--text-figure-sm); font-family: var(--ff-17); color: var(--ink-2); padding-right: calc(var(--group-padding) + 40px); }
.total { display: grid; grid-template-columns: 1fr auto 28px; column-gap: 12px; align-items: center; padding: 18px var(--group-padding) 12px; margin: 0 var(--gutter); }
.total .lab { font: var(--text-headline); }
.total .fig { position: relative; font: var(--text-figure-strong); font-family: var(--ff-17); white-space: nowrap; }
.total .fig::before { content: ""; position: absolute; right: 0; left: 0; top: -10px; height: var(--rule-width); background: var(--ink-3); }
.total .fig::after { content: ""; position: absolute; right: 0; left: 0; bottom: -7px; height: calc(2 * var(--rule-width) + var(--double-rule-gap)); border-top: var(--rule-width) solid var(--brass); border-bottom: var(--rule-width) solid var(--brass); }

/* ── Daily ───────────────────────────────────────────────────────────────── */
.lede { padding: 2px var(--gutter) 0; font: var(--text-body); color: var(--ink-2); }
.lede b { font-weight: 400; color: var(--ink); }
.chart { margin: 14px var(--gutter) 0; padding: 14px var(--group-padding) 10px; }
.chart svg { width: 100%; overflow: visible; }
.chart text { font: var(--text-caption); fill: var(--ink-2); }
.chart text.now { font-weight: 600; fill: var(--ink); }
.qa-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 var(--gutter); }
.qa { position: relative; height: 64px; border-radius: var(--radius-md); background: var(--surface); display: grid; grid-template-columns: 30px 1fr; column-gap: 8px; align-items: center; padding: 0 10px; text-align: left; }
.qa .ico { position: relative; width: 30px; height: 30px; display: grid; place-items: center; color: var(--ink); }
.qa .ico > svg { width: 24px; height: 24px; }
.qa .n { font: var(--text-subhead); font-weight: 600; display: block; white-space: nowrap; }
.qa .v { font: var(--text-figure-sm); font-family: var(--ff-17p); color: var(--ink-2); display: block; white-space: nowrap; }
.qa .plus { position: absolute; right: -3px; bottom: -2px; width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); box-shadow: 0 0 0 2px var(--surface); }
.qa .plus svg { width: 9px; height: 9px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 var(--gutter); scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: var(--radius-pill); display: inline-flex; align-items: center; gap: 6px; font: var(--text-subhead); font-weight: 500; color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 0.5px var(--hairline-strong); position: relative; max-width: 180px; white-space: nowrap; }
.chip::after { content: ""; position: absolute; inset: -4px 0; }
.chip svg { width: 17px; height: 17px; }
.chip[aria-selected="true"] { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.dayhead { display: flex; justify-content: space-between; align-items: baseline; padding: 0 calc(var(--gutter) + var(--group-padding)) 0 var(--gutter); margin: 24px 0 8px; }
.dayhead h3 { font: var(--text-headline); }
.dayhead .tot { font: var(--text-figure-sm); font-family: var(--ff-17); color: var(--ink-2); }
.dayhead .tot.words { font: var(--text-subhead); }

/* ── Controls ────────────────────────────────────────────────────────────── */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: 36px; padding: 2px; border-radius: var(--radius-pill); background: var(--surface-2); }
.seg button { text-align: center; border-radius: var(--radius-pill); font: var(--text-subhead); font-weight: 500; position: relative; }
.seg button::after { content: ""; position: absolute; inset: -4px 0; }
.seg button[aria-selected="true"] { background: var(--thumb); font-weight: 600; box-shadow: var(--shadow-thumb); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: var(--radius-pill); font: var(--text-headline); width: 100%; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.secondary { background: var(--surface-2); color: var(--accent-ink); }
.btn.md { height: 44px; width: auto; padding: 0 18px; font: var(--text-subhead); font-weight: 600; display: inline-flex; }
.btn.plain { background: none; color: var(--accent-ink); font-weight: 400; height: 44px; }
.btn.danger { background: none; color: var(--critical-ink); font-weight: 400; height: 44px; }
.btn svg { width: 18px; height: 18px; }
.addline { display: flex; align-items: center; gap: 10px; margin: 6px var(--gutter) 0; height: 44px; padding: 0 var(--group-padding); font: var(--text-body); color: var(--accent-ink); }
.addline svg { width: 20px; height: 20px; }
.frow { position: relative; display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 var(--group-padding); }
.frow + .frow::before { content: ""; position: absolute; top: 0; left: var(--group-padding); right: 0; height: var(--hairline-width); background: var(--hairline); }
.frow.ic + .frow::before, .frow + .frow.ic::before { left: 58px; }
.frow .k { font: var(--text-body); flex: 1; min-width: 0; }
.frow .val { font: var(--text-body); color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.frow .val.fig { font: var(--text-figure); font-family: var(--ff-17); color: var(--ink); }
.frow .val svg { width: 14px; height: 14px; color: var(--ink-3); }
.frow .lead { width: 30px; height: 30px; display: grid; place-items: center; color: var(--ink); }
.frow .lead svg { width: 22px; height: 22px; }
.frow.danger .k { color: var(--critical-ink); }
.frow.link .k { color: var(--accent-ink); }
.sw { position: relative; width: 51px; height: 31px; border-radius: 16px; background: var(--surface-2-strong); flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: var(--switch-knob); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18), 0 0 0 0.5px rgba(0, 0, 0, 0.04); }
.sw.on { background: var(--accent); }
.sw.on::after { left: 22px; background: var(--on-accent); }
.swatches { display: flex; justify-content: space-between; padding: 12px var(--group-padding) 14px; }
.swatch { position: relative; width: 30px; height: 30px; border-radius: 50%; }
.swatch::after { content: ""; position: absolute; inset: -7px; }
.swatch.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink); }

/* ── Tab bar ─────────────────────────────────────────────────────────────── */
.tabbar { position: absolute; left: var(--tabbar-inset); right: var(--tabbar-inset); bottom: var(--tabbar-offset); height: var(--tabbar-height); z-index: var(--z-tabbar); border-radius: var(--radius-pill); display: grid; grid-template-columns: 1fr 1fr 62px 1fr 1fr; align-items: center; padding: 4px; background: var(--glass); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: inset 0 0 0 0.5px var(--glass-edge), inset 0 1px 0 var(--glass-highlight), var(--shadow-float); }
.tab { height: 54px; border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink-2); font: var(--text-tab); }
.tab svg { width: 25px; height: 25px; }
.tab.on { color: var(--accent-ink); background: var(--lens); font-weight: 600; }
.tab .dot { position: absolute; }
.addbtn { justify-self: center; width: var(--add-button-size); height: var(--add-button-size); border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 3px 10px color-mix(in srgb, var(--ink) 22%, transparent); }
.addbtn svg { width: 24px; height: 24px; }
.edge-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 128px; z-index: 25; pointer-events: none; background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 0%, transparent), color-mix(in srgb, var(--bg) 82%, transparent) 30%, var(--bg) 52%); }

/* ── Sheets ──────────────────────────────────────────────────────────────── */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: var(--z-scrim); }
.sheet { position: absolute; left: var(--sheet-inset); right: var(--sheet-inset); bottom: var(--sheet-inset); z-index: var(--z-sheet); background: var(--surface-sheet); border-radius: var(--radius-sheet); box-shadow: var(--shadow-sheet); overflow: hidden; }
.sheet.large { top: 10px; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--hairline-strong); margin: 6px auto 0; }
.sheethead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 52px; padding: 0 12px; }
.sheethead .t { font: var(--text-sheet-title); text-align: center; white-space: nowrap; }
.sheethead .l { justify-self: start; }
.sheethead .r { justify-self: end; }
.amount { text-align: center; padding: 10px var(--gutter) 0; }

/* ── Engraving ───────────────────────────────────────────────────────────── */

/* ── Lock ────────────────────────────────────────────────────────────────── */

/* ── Welcome ─────────────────────────────────────────────────────────────── */
.welcome { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 0 24px; }

/* ── Banners, empty states, month picker ─────────────────────────────────── */
.banner { display: grid; grid-template-columns: 22px 1fr; column-gap: 12px; padding: 14px var(--group-padding); border-radius: var(--radius-lg); font: var(--text-subhead); color: var(--ink); }

.empty { display: grid; justify-items: center; text-align: center; padding: 26px 28px; }

.empty .coin svg { width: 28px; height: 28px; color: var(--ink-2); }
.empty h3 { font: var(--text-headline); margin-top: 12px; }
.empty p { font: var(--text-subhead); color: var(--ink-2); margin-top: 4px; max-width: 280px; }
.picker { padding: 6px 10px 12px; }
.picker .yr { display: flex; align-items: center; justify-content: space-between; height: 48px; }
.picker .yr b { font: var(--text-headline); }
.picker .yr button { width: 44px; height: 44px; display: grid; place-items: center; color: var(--accent-ink); }

.months { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.months button { height: 44px; border-radius: var(--radius-pill); font: var(--text-body); text-align: center; color: var(--ink); }
.months button.now { box-shadow: inset 0 0 0 1.5px var(--ink); }

.months button.off { color: var(--ink-disabled); }
.btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ── Kit and motion boards ───────────────────────────────────────────────── */
.board { padding: 8px var(--gutter) 40px; }
.board h2 { font: var(--text-headline); margin: 22px 0 10px; }
.board .note { font: var(--text-footnote); color: var(--ink-2); margin-top: 6px; }

.frame { background: var(--surface); border-radius: var(--radius-md); padding: 10px 0 8px; text-align: center; }

/* ── Wallet, goals and paying from the wallet (DESIGN §9.26) ─────────────── */
/* Home card: the balance as a closed bottom line */
.wcard { display: block; width: calc(100% - 2 * var(--gutter)); text-align: left; padding: 14px var(--group-padding) 16px; }
.wstat { display: flex; align-items: center; gap: 6px; min-height: 22px; margin-bottom: 4px; font: var(--text-subhead); font-weight: 600; color: var(--critical-ink); }

.ledger.carried { padding-bottom: 8px; }
.carry { display: flex; align-items: center; gap: 4px; width: calc(100% - 2 * var(--group-padding)); margin: 0 var(--group-padding) 2px; min-height: 44px; border-top: var(--hairline-width) solid var(--hairline); font: var(--text-subhead); color: var(--ink-2); text-align: left; }
.carry svg { width: 14px; height: 14px; margin-left: auto; color: var(--ink-3); }

.se .key { height: 48px; }

/* E3 The settings entry: monogram and greeting are one button (the press pill reaches 8px left) */
.me { position: relative; display: inline-flex; align-items: center; gap: 10px; min-height: var(--touch-min); margin-left: -8px; padding: 0 12px 0 8px; border-radius: var(--radius-pill); color: var(--ink); text-align: left; -webkit-touch-callout: none; }

.sheet.paper .sheethead.edge::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 18px; background: linear-gradient(var(--surface), color-mix(in srgb, var(--surface) 0%, transparent)); pointer-events: none; }

/* E2.1 The Split capsule and the split panel: content-sized, never taller than the keypad box */
.gcap.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }

.splitp { --panel: calc(10px + 4 * 56px); max-height: var(--panel); margin: 0 16px; padding: 10px 0 4px; overflow-y: auto; scrollbar-width: none; }

.splitp .phead { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; min-height: 28px; padding: 0 0 0 var(--group-padding); background: var(--surface-sheet); }
.splitp.overflow { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 20px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 20px), transparent); }

.people { background: var(--surface-raised); border-radius: var(--radius-lg); }

.person + .person::before { content: ""; position: absolute; top: 0; left: calc(var(--group-padding) + 36px); right: 0; height: var(--hairline-width); background: var(--hairline); }
.person .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: var(--text-body); font-size: var(--text-input); color: var(--ink); text-align: left; }
.person .amt { font: var(--text-figure); font-family: var(--ff-17); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }

.person .rm { width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center; color: var(--ink-3); }

.row .l2 .via { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
.row .l2 .via svg { width: 15px; height: 15px; flex: none; }

.ototal .figure { margin: 0; }

.ototal .figure .u { font: var(--text-figure-sm); font-family: var(--ff-17p); margin-left: 0.3em; }

.ohead { display: flex; align-items: center; gap: 10px; padding: 0 calc(var(--gutter) + var(--group-padding)) 0 var(--gutter); margin: 24px 0 8px; }
.ohead .n { flex: 1; font: var(--text-headline); }
.ohead .v { font: var(--text-figure); font-family: var(--ff-17); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.orow { padding-bottom: 8px; }
.orow .acts { display: flex; gap: 22px; margin-top: 5px; }
.orow .acts button { position: relative; min-height: 30px; font: var(--text-subhead); }
.orow .acts button::after { content: ""; position: absolute; inset: -7px -11px; }
.orow .acts .back { font-weight: 600; color: var(--accent-ink); }
.orow .acts .forgive { color: var(--ink-2); }
.markall { position: relative; display: flex; align-items: center; width: 100%; min-height: 50px; padding: 0 var(--group-padding); font: var(--text-body); color: var(--accent-ink); text-align: left; }
.markall::before { content: ""; position: absolute; top: 0; left: var(--group-padding); right: 0; height: var(--hairline-width); background: var(--hairline); }
.donehead { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 50px; padding: 0 var(--group-padding); text-align: left; }
.donehead .k { flex: 1; font: var(--text-body); }
.donehead .n { font: var(--text-body); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.donehead svg { width: 14px; height: 14px; color: var(--ink-3); }
.row .a.paid { color: var(--ink-2); }

/* Boards */
.board .card { background: var(--surface); border-radius: var(--radius-lg); }
.board .stack-v { display: grid; gap: 10px; }
.board .sheetbit { background: var(--surface-sheet); border-radius: var(--radius-lg); padding: 12px 0 14px; }
.board .sheetbit .amount { padding-top: 0; }
.board .sheetbit .amount .figure .v { font-size: 46px; }
.board .sheetbit .amount .figure .u { font-size: 23px; }
.board .sheetbit .splitp { max-height: none; margin: 0 12px; }
.board .sheetbit .sheethead { padding: 0 12px; min-height: 48px; margin: -6px 0 6px; }
.board .sheetbit .caret { height: 36px; transform: translateY(3px); }
.board .dialog { width: min(320px, 100% - 48px); margin: 0 auto; padding: 22px 20px 16px; border-radius: 28px; background: var(--surface-raised); box-shadow: var(--shadow-float); text-align: center; }
.board .dialog h3 { font: var(--text-headline); }
.board .dialog p { margin-top: 6px; font: var(--text-subhead); color: var(--ink-2); }
.board .dialog .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.board .dialog .btn { height: 48px; }
.board .scrimbit { padding: 22px 0; border-radius: var(--radius-lg); background: var(--scrim); }
.me-row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.me-cell { display: grid; gap: 4px; justify-items: start; }
.me-cell .lbl { font: var(--text-caption); color: var(--ink-2); padding-left: 2px; }
.me-cell .bar { display: flex; align-items: center; height: 44px; padding: 0 0 0 10px; background: var(--bg); border-radius: var(--radius-md); box-shadow: inset 0 0 0 var(--hairline-width) var(--hairline); }
</style>
</head>

}
let uid = 0
function engrave(kind, cls = 'engrave') {
  const p = 'x' + uid++
  const body = ENGRAVE[kind].replace(/id="(\w+)"/g, `id="${p}$1"`).replace(/href="#(\w+)"/g, `href="#${p}$1"`)
  const box = { seal: '-12 -12 24 24', medallion: '-16 -16 32 32' }[kind]
  return `<svg viewBox="${box}" class="${cls}" aria-hidden="true">${body}</svg>`
}

/* ── Hero, pace bar, ledger (as reference.html) ─────────────────────────────────────────────── */
function paceBar({ ratio, days, dayIndex, W = 353 }) {
  const y = 6, h = 6
  let s = `<svg viewBox="0 0 ${W} 26" role="img" aria-label="Pace">`
  s += `<rect x="0" y="${y}" width="${W}" height="${h}" rx="3" fill="var(--track)"/>`
  if (ratio > 0) s += `<rect x="0" y="${y}" width="${Math.max(6, W * Math.min(ratio, 1))}" height="${h}" rx="3" fill="var(--ink)"/>`
  for (let i = 1; i < days; i++) {
    const x = (W * i) / days, long = i % 5 === 0, past = dayIndex == null || i < dayIndex
    s += `<rect x="${(x - 0.5).toFixed(2)}" y="16" width="1" height="${long ? 8 : 4}" fill="${past ? 'var(--ink-3)' : 'var(--mark)'}"/>`
  }
  if (dayIndex != null) { const x = Math.max(1, (W * dayIndex) / days); s += `<rect x="${(x - 1).toFixed(2)}" y="1" width="2" height="16" rx="1" fill="var(--ink)"/>` }
  return s + '</svg>'
}
function heroLeft({ left, perDay, daysLeft, today, spent, available, days, dayIndex }) {
  return `<section class="hero" aria-label="Left to spend">
      <div class="hero-top"><span class="hero-label">Left to spend</span><span class="status">${ic('check-circle')}On track</span></div>
      <div class="figure" data-testid="hero-left"><span class="v">${num(left)}</span><span class="u">€</span></div>
      <p class="sentence" data-testid="hero-per-day">About ${eur(perDay)} a day for the next ${daysLeft} days</p>
      <p class="subline" data-testid="hero-today">Today: ${eur(today)} left</p>
      <div class="pace">${paceBar({ ratio: spent / available, days, dayIndex })}</div>
      <div class="pace-cap"><span>Spent ${eur(spent)} of ${eur(available)}</span><span>Day ${dayIndex} of ${days}</span></div>
    </section>`
}

/* ── E2.2 A split expense in a list: your share as the amount, the bill under it ───────────── */
function splitSub(split, settled = []) {
  const open = split.filter(([n]) => !settled.includes(n))
  if (!open.length) return `Split with ${split.map((s) => s[0]).join(' and ')}, settled`
  if (open.length === 1) return `Split, ${open[0][0]} owes ${eur(open[0][1])}`
  return `Split with ${open.length} people`
}
function splitRow(it, { settled = [] } = {}) {
  const mine = share(it), sub = splitSub(it.split, settled)
  return `<div class="row" data-testid="split-row" aria-label="${it.t}, ${eur(mine)}, your share of ${eur(it.a)}. ${sub}.">

      <div class="l2"><span class="via">${ic('users')}<span>${sub}</span></span><span class="of">of ${eur(it.a)}</span></div></div>

}

/* E2.2 Daily, scrolled to Saturday's split bills */
// Daily spending per day, 1–18 Oct, your shares (reference.html, with Saturday 50,00 € and Thursday 17,80 €)
const PERDAY = [1240, 3120, 890, 2250, 680, 1430, 2760, 970, 1820, 450, 3540, 1690, 1130, 2410, 1780, 1680, 5000, 800]
const QUICK = [{ name: 'Coffee', icon: 'coffee', cents: 350 }, { name: 'Bakery', icon: 'bread', cents: 250 }, { name: 'Mensa', icon: 'bowl-food', cents: 450 }]
function dayChart() {
  const W = 321, H = 72, max = 5000, slot = W / 31
  let s = `<svg viewBox="0 0 ${W} 96" role="img" aria-label="Spending per day in October"><rect x="0" y="${H}" width="${W}" height="0.75" fill="var(--chart-axis)"/>`
  PERDAY.forEach((v, i) => { const h = Math.max(2, (v / max) * H), x = (i + 0.5) * slot - 3; s += `<path d="M${x} ${H}v${-(h - 3)}a3 3 0 0 1 3 -3a3 3 0 0 1 3 3v${h - 3}z" fill="${i === 17 ? 'var(--chart-col-now)' : 'var(--chart-col)'}"/>` })
  const ry = H - (1734 / max) * H, rx = 17.5 * slot
  s += `<circle cx="${rx}" cy="${ry}" r="2.5" fill="var(--chart-ref)"/><rect x="${rx}" y="${ry - 0.5}" width="${W - rx}" height="1" fill="var(--chart-ref)"/><text x="${W}" y="${ry - 6}" text-anchor="end">17,33${NB}€ a day</text>`
  return s + `<text x="0" y="90">1 Oct</text><text x="${rx}" y="90" text-anchor="middle" class="now">Today</text><text x="${W}" y="90" text-anchor="end">31 Oct</text></svg>`
}
function dailySplit() {
  const chips = ['all', 'transport', 'eating', 'groceries', 'coffee', 'shopping', 'goingout']
  const body = `<header class="nav"><div class="lead"><span class="eyebrow">Daily spending</span></div>
      <div class="trail"><button class="gbtn glass" aria-label="Search">${ic('magnifying-glass')}</button>${stepper()}</div></header>
    <div class="titlerow">${monthTitle('October')}</div>
    <p class="lede"><b>${eur(33640)} spent</b>, about ${eur(1869)} a day</p>
    <div class="group chart">${dayChart()}</div>
    <div class="sect" style="margin-top:26px"><h2>Quick add</h2><button class="link">Edit</button></div>
    <div class="qa-row">${QUICK.map((q) => `<button class="qa" aria-label="Add ${q.name}, ${eur(q.cents)}"><span class="ico">${ic(q.icon, 'light')}<span class="plus">${ic('plus', 'bold')}</span></span><span><span class="n">${q.name}</span><span class="v">${eur(q.cents)}</span></span></button>`).join('')}</div>
    <div class="chips" role="tablist" aria-label="Categories" style="margin-top:22px" id="chips">${chips.map((c) => c === 'all'
      ? `<button class="chip" role="tab" aria-selected="true">All</button>`
      : `<button class="chip" role="tab" aria-selected="false">${ic(CAT[c].icon, 'light')}${CAT[c].name}</button>`).join('')}</div>
    ${DAYS.map((d) => `<div class="dayhead"><h3>${d.label}</h3><span class="tot">${eur(total(d.items, share))}</span></div>
      <div class="group">${d.items.map(dayRow).join('')}</div>`).join('')}`
  const compact = `<div class="compact"><span></span><div class="mid"><span class="t">October</span><span class="s">${eur(33640)} spent</span></div><div class="trail"><button class="gbtn glass" aria-label="Search">${ic('magnifying-glass')}</button>${stepper()}</div></div>`
  return screen(body, { tab: 'daily', overlay: compact })
}

/* E2.3 Owed to you (pushed on Home) */
function owedItem(p, it) {
  const id = `o${uid++}`
  return `<div class="row orow" data-testid="owed-item">${coin(it.cat)}
    <div class="main"><div class="l1"><span class="t" id="${id}">${it.note}</span><span class="a">${eur(it.cents)}</span></div>
      <div class="l2"><span>${it.date}</span><span class="of">of ${eur(it.bill)}</span></div>
      <div class="acts"><button class="back" data-testid="owed-paid" aria-describedby="${id}">Paid back</button><button class="forgive" data-testid="owed-forgive" aria-describedby="${id}">Forgive</button></div></div>
  </div>`
}
function owed() {
  const sum = owedTotal(OWED), bills = new Set(OWED.flatMap((p) => p.items.map((i) => i.note))).size
  const body = `<header class="nav"><div class="lead"><button class="gcap glass" style="padding:0 14px 0 10px">${ic('caret-left', 'bold')}Home</button></div></header>
    <h1 class="otitle">Owed to you</h1>
    <div class="ototal"><div class="figure" data-testid="owed-total"><span class="v">${num(sum)}</span><span class="u">€</span></div>
      <p>${OWED.length} people owe you for ${bills} bills.</p></div>
    ${OWED.map((p) => `<section aria-label="${p.name}, ${eur(total(p.items, (i) => i.cents))}"><div class="ohead">${pcoin(p.name, 'sm')}<span class="n">${p.name}</span><span class="v">${eur(total(p.items, (i) => i.cents))}</span></div>
      <div class="group">${p.items.map((it) => owedItem(p, it)).join('')}${p.items.length > 1 ? `<button class="markall" data-testid="owed-all">Mark all as paid</button>` : ''}</div></section>`).join('')}
    <div class="group" style="margin-top:24px"><button class="donehead" aria-expanded="false" data-testid="owed-settled"><span class="k">Settled</span><span class="n">${SETTLED.length}</span>${ic('caret-down', 'bold')}</button></div>
    <p class="foot">Your budget counts only your share. Forgiving a split counts it as your own spending again.</p>`
  return screen(body, { tab: 'home' })
}

/* Board: the states of every extra part, small */
function states() {
  const note = (t) => `<p class="note" style="margin:6px 0 14px">${t}</p>`
  const mini = (label, crit, fig, sentence) => `<div class="mini-hero"><div class="hero-top"><span class="hero-label${crit ? ' crit' : ''}">${crit ? ic('warning-octagon', 'fill') : ''}${label}</span><span class="seal-chip">${engrave('seal', '')}Closed 31 Oct</span></div><div class="figure${crit ? ' crit' : ''}"><span class="v">${fig}</span><span class="u">€</span></div><p class="sentence">${sentence}</p></div>`
  const chg = (n, a, line) => `<li><i class="dot" style="background:${CATVAR(n)}"></i><span class="n">${CAT[n].name}</span><span class="v">${eur(a)}</span><span class="chg">${line}</span></li>`
  const settledBar = { t: 'Bar with friends', cat: 'goingout', a: 1800, split: [['Max', 900]] }
  const four = [...OWED, { name: 'Jonas', items: [{ note: 'Concert tickets', cat: 'goingout', date: 'Fri 9 Oct', cents: 1200, bill: 4800 }] }, { name: 'Sara', items: [{ note: 'Groceries', cat: 'groceries', date: 'Mon 12 Oct', cents: 640, bill: 1280 }] }]
  four.sort((a, b) => owedTotal([b]) - owedTotal([a]))
  const cell = (lbl, html) => `<div class="me-cell"><div class="bar">${html}</div><span class="lbl">${lbl}</span></div>`
  const body = `<header class="nav"><div class="lead"><span class="eyebrow">Reference</span></div></header>
    <h1 class="largetitle">Extras: states</h1>
    <div class="board" style="padding-top:4px">
      <h2>Review banner (Home, first open after a close)</h2>
      <div class="stack-v">${reviewBanner('moved').replace(' home-banner', '')}${reviewBanner('taken')}</div>
      ${note('Statement paper with the 22px brass seal. "Dismiss" marks the month reviewed; the review stays on that month’s Home.')}
      <h2>Review: the result</h2>
      ${mini('Moved to your wallet', false, '132,82', '100,00 € of savings and 32,82 € left over.')}
      ${mini('Moved to your wallet', false, '76,60', '100,00 € of savings, less 23,40 € over budget.')}
      ${mini('Taken from your wallet', true, '41,28', 'You spent 41,28 € more than came in.')}
      ${note('An overspent month keeps the brass seal (it is settled) with a critical figure. With no savings the sentence is left out: the figure is what was left over.')}
      <h2>Change against the previous month</h2>
      <div class="card" style="padding:0 var(--group-padding)"><ul class="rv-legend" style="margin:0">
        ${chg('groceries', 18630, `${ic('arrow-up')}8${NNB}% more than September`)}${chg('eating', 12150, `${ic('arrow-down')}14${NNB}% less than September`)}
        ${chg('transport', 1950, 'Same as September')}${chg('health', 3490, 'New in October')}</ul></div>
      ${note('Arrow and words, all --ink-2: never red or green. Same: under 0.5 % either way. New: nothing the month before.')}
      <h2>Daily rows of a split expense</h2>
      <div class="card">${splitRow(DAYS[1].items[0])}${splitRow(DAYS[1].items[1])}${splitRow(DAYS[1].items[1], { settled: ['Max'] })}${splitRow(settledBar, { settled: ['Max'] })}</div>
      ${note('Open: who owes what, or "Split with {n} people". Partly paid back: only who still owes. All paid back: "settled". The amount is always your share; "of" the bill sits under it.')}
      <h2>Transaction sheet, keypad back, a split set</h2>
      <div class="sheetbit">
        <div class="sheethead"><button class="gcap glass l">Cancel</button><span class="t">New expense</span><button class="gcap glass r set" aria-expanded="false">Split</button></div>
        <div class="amount"><div class="figure"><span class="v">18,00</span><span class="caret" aria-hidden="true"></span><span class="u">€</span></div>
          <p class="share">Your share: <b>9,00${NB}€</b></p><p class="consequence">Leaves <b>0,34${NB}€</b> for today</p></div>
      </div>
      ${note('Tapping the amount brings the keypad back and keeps the split. The capsule turns tinted (a split is set); "Your share" stays, and the consequence line counts only your share.')}
      <h2>Split panel: what others owe is more than the bill</h2>
      <div class="sheetbit">
        <div class="amount"><div class="figure"><span class="v">18,00</span><span class="u">€</span></div>
          <p class="share crit">${ic('warning-octagon', 'fill')}Others owe more than the bill of 18,00${NB}€</p></div>
        ${splitPanel([['Max', 2000]], { suggestions: ['Lea', 'Jonas'] })}
      </div>
      ${note('"Add expense" stays disabled until the shares fit the bill. Up to two people fit 375×667 without scrolling; more scroll inside the panel, which is never taller than the keypad.')}
      <h2>Paid back, and forgiving</h2>
      <div style="position:relative;height:56px"><div class="toast" style="position:static;box-shadow:none"><span class="msg">Max paid back 9,00${NB}€</span><button>Undo</button></div></div>
      <div class="scrimbit" style="margin-top:12px"><div class="dialog" role="alertdialog" aria-labelledby="fg-t" aria-describedby="fg-m"><h3 id="fg-t">Forgive 9,00${NB}€?</h3><p id="fg-m">It counts as your own spending again.</p>
        <div class="two"><button class="btn secondary">Cancel</button><button class="btn primary">Forgive</button></div></div></div>
      ${note('Paid back acts at once and offers Undo (withUndo). Forgive asks first: it raises your spending, so the confirm is primary, not destructive.')}

      ${owedCard(four).replace('<div class="sect">', '<div class="sect" style="margin:0 0 10px;padding:0">').replace('class="group"', 'class="group" style="margin:0"')}
      ${note('Top three by amount, then one line for the rest. Hidden when nothing is open.')}

        ${cell('Compact header', meButton({ compact: true, dot: true }))}
      </div>
      ${note('One button: medallion and greeting. 44 tall; the press pill reaches 8px left of the medallion. Name: "Settings", or "Settings, backup due" with the dot.')}
    </div>`
  return screen(body, { tab: '' })
}

const SCREENS = {
  review: () => review(), 'review-end': () => review({ end: true }), 'review-banner': reviewHome, 'past-review': pastReview,
  'add-split': addSplit, 'daily-split': dailySplit, owed, 'home-owed': homeOwed, 'home-settings': homeSettings, states,
}
document.getElementById('app').innerHTML = (SCREENS[SCREEN] || SCREENS.review)()

// Measure the widest figure so the sum rule and the double rule span exactly the figure column.
for (const l of document.querySelectorAll('.ledger')) {
  const w = Math.max(...[...l.querySelectorAll('.fig')].map((e) => e.scrollWidth))
  l.style.setProperty('--figw', w + 'px')
}
const sc = document.querySelector('.scroll')
const offsetIn = (el) => el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop
if (SCREEN === 'home-owed') sc.scrollTop = offsetIn(document.querySelector('[data-testid=owed-card]')) - 352
if (SCREEN === 'daily-split') sc.scrollTop = offsetIn(document.getElementById('chips')) - 52
if (SCREEN === 'past-review') sc.scrollTop = offsetIn(document.querySelector('.ledger')) - 128
for (const p of document.querySelectorAll('.splitp')) if (p.scrollHeight > p.clientHeight + 1) p.classList.add('overflow')
if (SCREEN === 'review-end') { const b = document.querySelector('.sbody'); b.scrollTop = b.scrollHeight }
</script>
